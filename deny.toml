# cargo-deny configuration. Every dependency must be compatible with
# AGPL-3.0-or-later (see AGENTS.md §9 and docs/adr/0001-mupdf-agpl.md).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates are only actionable when we depend on them directly;
# transitive ones (e.g. unic-* through Tauri) are tracked upstream.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  # Copyleft licenses that can be combined with AGPL-3.0-or-later.
  "AGPL-3.0-or-later",
  "AGPL-3.0-only",
  "AGPL-3.0",  # deprecated SPDX id (= AGPL-3.0-only) used by mupdf and mupdf-sys
  "GPL-3.0-or-later",
  "GPL-3.0-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "LGPL-3.0-only",
  "MPL-2.0",
  # Permissive licenses.
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
]
# Our own crates are `publish = false` and licensed through the workspace.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
