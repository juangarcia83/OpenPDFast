[package]
name = "app"
description = "Desktop shell (Tauri 2): IPC commands, state and windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `app_lib` avoids the lib/bin .pdb name collision on Windows (rust-lang/cargo#8519).
[lib]
name = "app_lib"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
doc = { workspace = true, features = ["specta"] }
render = { workspace = true, features = ["specta"] }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-specta.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["fs", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
